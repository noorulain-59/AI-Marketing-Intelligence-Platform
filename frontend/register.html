<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account · AI Marketing Intelligence Platform</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="sub">The first person to register on a fresh database becomes the admin.</p>

      <form id="registerForm">
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" required placeholder="Noor ul Ain" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@company.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" />
        </div>
        <button type="submit" class="btn btn-block">Create Account</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>

      <p class="foot-link">Already have an account? <a href="/index.html">Sign in</a></p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (getToken()) window.location.href = '/dashboard.html';

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = '';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        // role: 'admin' only actually takes effect if no admin exists yet (see backend)
        const data = await api('/auth/register', { method: 'POST', body: { name, email, password, role: 'admin' }, auth: false });
        setSession(data.token, data.user);
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorMsg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
