<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In · AI Marketing Intelligence Platform</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to your AI Marketing Intelligence dashboard.</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" placeholder="you@company.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-block">Sign In</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>

      <p class="foot-link">
        No account? <a href="/register.html">Create one</a><br/>
        <small>Demo login (after running <code>npm run seed</code>): admin@demo.com / admin123</small>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // Already logged in? go straight to dashboard.
    if (getToken()) window.location.href = '/dashboard.html';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = '';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const data = await api('/auth/login', { method: 'POST', body: { email, password }, auth: false });
        setSession(data.token, data.user);
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorMsg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
